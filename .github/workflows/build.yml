name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build LSPosed module APK
        working-directory: xposed-module
        run: gradle assembleDebug --no-daemon

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/^version=.*/version=${GITHUB_REF_NAME}/" ksu-module/module.prop
          sed -i "s/^versionCode=.*/versionCode=${GITHUB_RUN_NUMBER}/" ksu-module/module.prop

      - name: Package KernelSU module
        run: |
          mkdir -p dist
          cp xposed-module/app/build/outputs/apk/debug/app-debug.apk ksu-module/apk/ForceAOD.apk
          cp ksu-module/apk/ForceAOD.apk dist/ForceAOD-lsposed.apk
          cd ksu-module
          zip -r ../dist/ForceAOD-ksu.zip . -x 'apk/README.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: ForceAOD
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
